name: Dockerfile version drift check

# After a dependabot PR is merged, if the Dockerfile image is upversioned
# then check the tool versions as written in the Dockerfile comments.
# Created in collaboration with Github Copilot

on:
  pull_request:
    types: [closed]
    paths:
      - 'Dockerfile'

jobs:
  check-dockerfile-comments:
    # Only run when a Dependabot PR is merged into main
    if: github.event.pull_request.merged == true && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Extract the base image from the first FROM line, for the PR body
      - name: Extract base image
        id: image
        run: |
          IMAGE=$(awk '/^FROM / {print $2; exit}' Dockerfile)
          # Drop the digest (e.g., "debian:trixie-slim" from "debian:trixie-slim@sha256:...")
          echo "base=${IMAGE%%@*}" >> "$GITHUB_OUTPUT"

      # The base image is plain Debian. bats and jq are installed by the
      # Dockerfile, so build the test runner image and ask it for the versions.
      - name: Build test runner image
        run: docker build --tag jq-test-runner .

      # Run the container and capture actual installed versions
      - name: Check runtime versions in container
        id: versions
        shell: bash
        run: |
          IMAGE=jq-test-runner
          
          # Query each tool version. The image's entrypoint is run.sh, so
          # override it to run each tool directly.
          BASH=$(docker run --rm --entrypoint bash "$IMAGE" --version | head -n 1)
          BATS=$(docker run --rm --entrypoint bats "$IMAGE" --version)
          JQ=$(docker run --rm --entrypoint jq "$IMAGE" --version)
          
          {
            echo "bash=$BASH"
            echo "bats=$BATS"
            echo "jq=$JQ"
          } >> "$GITHUB_OUTPUT"
          
          echo "Detected versions:"
          echo "  bash: $BASH"
          echo "  bats: $BATS"
          echo "  jq:   $JQ"

      # Update Dockerfile comments to match actual versions
      - name: Update Dockerfile comments
        shell: bash
        run: |
          python3 <<'PYTHON_EOF'
          import os
          import re
          from pathlib import Path
          
          dockerfile = Path("Dockerfile")
          content = dockerfile.read_text()
          
          # Update bash version comment
          content = re.sub(
              r'# \$ bash --version   # => .+',
              f'# $ bash --version   # => {os.environ["BASH"]}',
              content
          )
          
          # Update bats version comment
          content = re.sub(
              r'# \$ bats --version   # => .+',
              f'# $ bats --version   # => {os.environ["BATS"]}',
              content
          )
          
          # Update jq version comment
          content = re.sub(
              r'# \$ jq --version     # => .+',
              f'# $ jq --version     # => {os.environ["JQ"]}',
              content
          )
          
          dockerfile.write_text(content)
          PYTHON_EOF
        env:
          BASH: ${{ steps.versions.outputs.bash }}
          BATS: ${{ steps.versions.outputs.bats }}
          JQ: ${{ steps.versions.outputs.jq }}

      # Check if the Dockerfile was actually modified
      - name: Check if Dockerfile changed
        id: diff
        run: |
          if git diff --quiet -- Dockerfile; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "=== Changes ===" 
            git diff Dockerfile
          fi

      # Create a PR only if versions actually changed
      - name: Create PR with updated comment values
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          commit-message: "chore: update Dockerfile version comments"
          title: "chore: update Dockerfile version comments"
          body: |
            This PR updates the Dockerfile comments to match the installed tool versions for `${{ steps.image.outputs.base }}`.

            **Updated:**
            - `bash --version` comment
            - `bats --version` comment
            - `jq --version` comment

            **Verified in runtime image:**
            ```
            ${{ steps.versions.outputs.bash }}
            ${{ steps.versions.outputs.bats }}
            ${{ steps.versions.outputs.jq }}
            ```
          branch: chore/dockerfile-version-comments
          delete-branch: true
